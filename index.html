<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="QuietRead Legal information: on-device speech, privacy choices, and App Store purchases.">
  <title>QuietRead · Legal information</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #293348; background: #e8edf3; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { max-width: 800px; margin: 0 auto; padding: 48px 24px 64px; }
    header { margin-bottom: 32px; }
    .brand { color: #53647d; font-weight: 700; letter-spacing: .08em; }
    h1 { font-size: clamp(28px, 5vw, 38px); line-height: 1.2; margin: 16px 0; }
    h2 { font-size: 24px; margin: 32px 0 16px; }
    h3 { font-size: 18px; margin: 24px 0 8px; }
    p, li { font-size: 16px; line-height: 1.65; }
    p { margin: 8px 0 16px; }
    a { color: #315479; text-underline-offset: 3px; }
    nav { display: flex; gap: 16px; flex-wrap: wrap; margin: 24px 0; }
    nav a { display: inline-flex; align-items: center; min-height: 44px; padding: 8px 16px; border-radius: 12px; background: #e8edf3; box-shadow: 4px 4px 10px #cad1dc, -4px -4px 10px #fff; text-decoration: none; font-weight: 600; }
    .draft { padding: 16px; border: 1px solid #aebdce; border-radius: 12px; background: #f3f6fa; line-height: 1.6; }
    .muted { color: #5a687e; }
    section + section { margin-top: 48px; padding-top: 16px; border-top: 1px solid #c6d0dd; }
    :target { scroll-margin-top: 24px; }
    @media (max-width: 480px) { main { padding: 24px 20px 40px; } }
  
    a:focus-visible { outline: 3px solid #315479; outline-offset: 4px; }
    footer { margin-top: 40px; padding-top: 20px; border-top: 1px solid #c6d0dd; }</style>
</head>
<body><main>
  <header><div class="brand">QUIETREAD</div><h1>Legal information</h1>
  <p class="muted">Last updated: 03 October 2026</p>
  <nav aria-label="Legal pages"><a href="privacy.html">Privacy Policy</a><a href="terms.html">Terms of Use</a></nav></header>
  <section><p>Read the <a href="privacy.html">Privacy Policy</a> and <a href="terms.html">Terms of Use</a> for QuietRead: Read &amp; Listen.</p></section>
  <footer><a href="https://github.com/dat08101999/quietread-legal/issues/new">Contact support</a></footer>
</main></body></html>
